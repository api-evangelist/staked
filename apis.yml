name: Staked
description: 'Staked was an institutional cryptocurrency staking and delegation provider that ran validator
  infrastructure and non-custodial staking services across proof-of-stake networks including Ethereum,
  Solana, Polkadot, and Cosmos. Founded in 2018 and backed by Pantera Capital, Staked was acquired by
  Kraken in December 2021 and its products have since been folded into Kraken Staking. The former staked.us
  domain now serves a static notice redirecting users to staking.kraken.com and kraken.com/institutions/staking;
  no independent developer portal, public API, or documentation surface remains under the Staked brand.'
